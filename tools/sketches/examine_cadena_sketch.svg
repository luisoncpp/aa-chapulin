<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Examine cadena: boceto de continuidad, puerta 304</title>
<desc id="desc">Corrected interior views: no suite number on the inside. Hinges at left; knob, slide plate and frame anchor at right. The door swings inward toward the viewer, with the hinge axis fixed at left and the free edge advancing into the room. The first door is open, the middle door is half open, and the third is closed with its chain engaged. The same door group and hardware are projected together. Each chain has ten equal links and a centerline length of 180 drawing units. The rope stays on the same latch edge, with retained fibers shown in the last state. Flat-color sketch for regeneration; annotations are not final game artwork.</desc>

